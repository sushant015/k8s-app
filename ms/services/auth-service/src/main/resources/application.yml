server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/votepoll}
    username: ${DB_USER:votepoll}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth

jwt:
  secret: ${JWT_SECRET:change-this-jwt-secret-key-min-32-chars!!}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
