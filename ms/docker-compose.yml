# Local dev stack — no GCP required.
# Usage: docker compose up --build
# App:   http://localhost:8080

name: vote-poll

x-common-env: &common-env
  DB_USER: votepoll
  DB_PASSWORD: changeme
  JWT_SECRET: local-dev-jwt-secret-key-min-32-chars!!

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: votepoll
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: votepoll
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votepoll -d votepoll"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build: ./services/auth-service
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/votepoll
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  poll-service:
    build: ./services/poll-service
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/votepoll
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://votepoll:changeme@postgres:5432/votepoll
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s

  vote-service:
    build: ./services/vote-service
    environment:
      DATABASE_URL: postgresql://votepoll:changeme@postgres:5432/votepoll
    depends_on:
      postgres:
        condition: service_healthy
      poll-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s

  result-service:
    build: ./services/result-service
    environment:
      DATABASE_URL: postgresql://votepoll:changeme@postgres:5432/votepoll
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  api-gateway:
    build: ./services/api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-service:8080
      POLL_SERVICE_URL: http://poll-service:8080
      VOTE_SERVICE_URL: http://vote-service:8080
      RESULT_SERVICE_URL: http://result-service:8080
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      poll-service:
        condition: service_healthy
      vote-service:
        condition: service_healthy
      result-service:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    build: ./services/frontend
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "8080:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
