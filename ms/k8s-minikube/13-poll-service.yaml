---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll-service
  namespace: vote-poll
  labels:
    app: poll-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Ensure zero downtime by creating a new pod before terminating an old one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: poll-service
  template:
    metadata:
      labels:
        app: poll-service
        version: latest
    spec:
      containers:
        - name: poll-service
          image: poll-service:20260723-200028
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vote-poll-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: POLL_JDBC_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poll-service
  namespace: vote-poll
spec:
  selector:
    app: poll-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
