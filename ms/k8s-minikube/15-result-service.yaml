---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-service
  namespace: vote-poll
  labels:
    app: result-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Ensure zero downtime by creating a new pod before terminating an old one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: result-service
  template:
    metadata:
      labels:
        app: result-service
        version: latest
    spec:
      containers:
        - name: result-service
          image: result-service:20260723-200028
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: RESULT_DATABASE_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vote-poll-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: vote-poll
spec:
  selector:
    app: result-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
