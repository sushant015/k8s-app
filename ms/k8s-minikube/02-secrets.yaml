# Secrets for Minikube Development Environment
# Contains PostgreSQL credentials and connection details
# WARNING: This is for development only. For production, use proper secret management.
# Schema: Mirrors production Cloud SQL (ms/database/init.sql)
apiVersion: v1
kind: Secret
metadata:
  name: vote-poll-secrets
  namespace: vote-poll
type: Opaque
stringData:
  # PostgreSQL Credentials
  DB_USER: "postgres"
  DB_PASSWORD: "postgres_password"
  
  # Single JDBC Connection URL (all services use same database, different schemas)
  # Services use schema-qualified tables:
  # - auth.admins (auth service)
  # - users.profiles (user service)
  # - polls.polls, polls.options (poll service)
  # - votes.votes (vote service)
  # - results.snapshots, results.option_totals (result service)
  JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres"
  
  # Alternative JDBC URLs with schema-specific settings (if needed by services)
  # Format: jdbc:postgresql://host:port/database?currentSchema=schema_name
  AUTH_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=auth"
  USER_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=users"
  POLL_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=polls"
  VOTE_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=votes"
  RESULT_JDBC_URL: "jdbc:postgresql://postgres-db:5432/postgres?currentSchema=results"
  
  # JWT Secret for authentication (generate a strong secret in production)
  JWT_SECRET: "dev-secret-key-change-in-production-12345"
  
  # Additional optional settings
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_IDLE_TIME: "30"
