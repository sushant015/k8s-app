jenkins:

  systemMessage: |
    Jenkins GitOps
    Managed by Configuration as Code

  numExecutors: ${JENKINS_EXECUTORS:-2}

  mode: NORMAL

  scmCheckoutRetryCount: 2

  disableRememberMe: false

  labelString: ""

  globalNodeProperties:
    - envVars:
        env:
          - key: SEED_REPO
            value: "${SEED_REPO}"

          - key: SEED_BRANCH
            value: "${SEED_BRANCH:-main}"

          - key: GITHUB_CREDENTIAL
            value: "github-token"

unclassified:

  location:
    url: "${JENKINS_URL}"
    adminAddress: "admin@example.com"

  mailer:
    replyToAddress: "${ADMIN_EMAIL:-admin@example.com}"

  scmGit:
    globalConfigName: "${GIT_USERNAME:-Jenkins}"
    globalConfigEmail: "${GIT_EMAIL:-jenkins@example.com}"